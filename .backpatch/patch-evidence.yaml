    note: Carried from 2.17.2.1-backpatch-00008; ported onto 2.17.2; fixed at 2.17.2.1-backpatch-00008 (backpatch-logging-log4j2@a8563db). A Socket or Syslog appender with `protocol="SSL"` and no `<Ssl>` element now fails to connect with a `NullPointerException` from `SslSocketManager`, as upstream does (apache/logging-log4j2 issue 4026). Such an appender relied on the JVM's default SSL context, for example through `javax.net.ssl.trustStore`. If you configure one, add an `<Ssl>` element with your key store and trust store.
